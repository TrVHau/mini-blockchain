[package]
name = "mini-blockchain-rs"
version = "1.0.0"
edition = "2021"
description = "A simple blockchain for learning purposes (Rust port of mini-blockchain)"
license = "ISC"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
secp256k1 = { version = "0.29", features = ["rand"] }
rand = "0.8"
hex = "0.4"
rustyline = "14"
chrono = "0.4"

# Mining là hot path — tối ưu release
[profile.release]
lto = true
codegen-units = 1
